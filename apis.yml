aid: labstep
name: Labstep
description: Labstep is a cloud-based Electronic Lab Notebook (ELN) and research data
  management platform for life-science, chemistry and pharma R&D teams. It combines
  step-by-step interactive protocols, structured experiment data capture, inventory
  and sample management with QR scanning, order management, instrument/device integration,
  chemistry and sequence tooling, and integrated Jupyter Notebooks for analysis — all
  under an audit trail with electronic signatures and sample lineage. Labstep exposes
  a public REST API at api.labstep.com secured with a per-user API key, plus an officially
  maintained Python SDK (labstepPy) and an R package (labstepR) that wrap the same
  generic entity surface used by the application itself.
