apis:
- aid: labstep:labstep-api
  name: Labstep API
  description: The Labstep REST API exposes the same generic entity surface the Labstep
    application uses — experiments, protocols, resources, resource items, locations,
    devices, device data, orders, metadata, files, tags, collections, workspaces and
    users. Requests are authenticated with a per-user API key sent in an `apikey` header
    (an Authorization Bearer token form is also supported), and entities are read,
    filtered, created, edited and deleted under `/api/generic/<entity>` with a POST
    `/filter` endpoint for structured predicate queries.
